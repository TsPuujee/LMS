# Production stack:  make prod-deploy
# All values come from .env.production (passed with --env-file by the Makefile).
name: lms-prod

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: prod
        image: lms-app:${IMAGE_TAG:-latest}
        env_file: .env.production
        volumes:
            - app_storage:/var/www/html/storage/app
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    nginx:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: nginx
        image: lms-nginx:${IMAGE_TAG:-latest}
        ports:
            - '${APP_PORT:-80}:80'
        depends_on:
            - app
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -qO- http://127.0.0.1/up >/dev/null || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env.production}
            MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env.production}
            MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.production}
            TZ: Asia/Ulaanbaatar
        command:
            [
                '--character-set-server=utf8mb4',
                '--collation-server=utf8mb4_unicode_ci',
            ]
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

volumes:
    mysql_data:
    app_storage:
