# Development stack:  make dev
name: lms

x-app: &app
    image: lms-dev
    volumes:
        - ./:/var/www/html
    environment:
        TZ: Asia/Ulaanbaatar

services:
    app:
        <<: *app
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: dev
            args:
                UID: ${HOST_UID:-1000}
                GID: ${HOST_GID:-1000}
        depends_on:
            mysql:
                condition: service_healthy

    vite:
        <<: *app
        command: ['npm', 'run', 'dev']
        ports:
            - '${VITE_PORT:-5173}:5173'
        depends_on:
            - app

    nginx:
        image: nginx:stable-alpine
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-lms}
            MYSQL_USER: ${DB_USERNAME:-lms}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            TZ: Asia/Ulaanbaatar
        command:
            [
                '--character-set-server=utf8mb4',
                '--collation-server=utf8mb4_unicode_ci',
            ]
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    mysql_data:
